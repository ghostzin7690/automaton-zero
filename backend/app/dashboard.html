<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automaton V4</title><style>body{font-family:Arial;max-width:1000px;margin:auto;padding:24px;background:#101218;color:#eee}.card{background:#191c23;border:1px solid #30343d;border-radius:14px;padding:18px;margin:12px 0}button{padding:10px 14px;border:0;border-radius:8px;margin:4px}.score{font-size:26px}</style></head><body><h1>🤖 Automaton V4</h1><p>Pesquisa → validação → produto → teste → aprendizado</p><button onclick="research()">🔎 Executar pesquisa</button><pre id="out"></pre><h2>🎯 Oportunidades</h2><div id="opps"></div><h2>📦 Produtos</h2><div id="products"></div><script>const t=localStorage.getItem('token')||prompt('X-Run-Token:')||'';localStorage.setItem('token',t);async function api(u,o={}){o.headers={...(o.headers||{}),'X-Run-Token':t};return(await fetch(u,o)).json()}async function research(){out.textContent='Pesquisando...';out.textContent=JSON.stringify(await api('/api/research/run',{method:'POST'}),null,2);load()}async function build(id){alert(JSON.stringify(await api('/api/opportunities/'+id+'/build',{method:'POST'})));load()}async function load(){let a=await api('/api/opportunities');opps.innerHTML=a.map(x=>`<div class=card><div class=score>${x.score}</div><b>${x.niche}</b><p>${x.problem}</p><button onclick="build(${x.id})">Criar MVP</button></div>`).join('');let p=await api('/api/products');products.innerHTML=p.map(x=>`<div class=card><b>${x.name}</b> — R$${Number(x.price).toFixed(2)}<br>${x.status}<br><a href=/api/products/${x.id}/pdf target=_blank>PDF</a></div>`).join('')}load()</script></body></html>
